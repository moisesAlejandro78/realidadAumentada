<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prueba Modelo 3D</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    h1 {
      margin: 16px;
      font-size: 1.3rem;
    }
    model-viewer {
      width: 100%;
      height: 80vh;
      background: #222;
    }
  </style>
</head>
<body>

  <h1>Prueba de modelo 3D</h1>

  <model-viewer
    src="prueba.glb"
    alt="Modelo de prueba"
    camera-controls
    auto-rotate
    ar
    ar-modes="webxr scene-viewer quick-look"
    shadow-intensity="1"
  >
    <button slot="ar-button" style="
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
    ">
      Ver en AR
    </button>
  </model-viewer>

</body>
</html>
