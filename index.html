<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>UniMap - Realidad Aumentada sin Marcador</title>

  <!-- Librería model-viewer de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 16px;
      text-align: center;
      background: #1e293b;
    }

    header h1 {
      margin: 0;
      font-size: 1.3rem;
    }

    header p {
      margin: 6px 0 0;
      font-size: 0.9rem;
      opacity: 0.85;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      background-color: #1e293b;
    }

    .botones {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
    }

    button, .ar-button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      width: 90%;
      max-width: 320px;
    }

    button:active {
      transform: scale(0.97);
    }

    .instrucciones {
      padding: 0 20px 20px;
      font-size: 0.9rem;
      line-height: 1.5;
      opacity: 0.9;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>UniMap – Realidad Aumentada</h1>
    <p>Coloca el edificio en cualquier superficie</p>
  </header>

  <!-- Aquí va tu modelo 3D -->
  <model-viewer
    src="modelos/PBtorreInnovacion.glb"
    alt="Edificio Univalle"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    touch-action="pan-y"
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
    auto-rotate
    rotation-per-second="20deg"
    style="width: 100%; height: 70vh;"
  >
    <!-- Botón personalizado de AR -->
    <button slot="ar-button" class="ar-button">
      Ver en Realidad Aumentada
    </button>
  </model-viewer>

  <div class="botones">
    <p class="instrucciones">
      1. Toca el botón <strong>"Ver en Realidad Aumentada"</strong><br>
      2. Apunta a una mesa, piso o pared<br>
      3. Toca la pantalla para colocar el edificio<br>
      4. Muévelo y rotalo con los dedos
    </p>
  </div>

</body>
</html>
